<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Loop Visualizer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h2 {
            color: #569cd6;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            gap: 40px;
            background: #252526;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            align-items: flex-start;
        }

        /* Grid Styles */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            gap: 8px;
        }

        .tile {
            width: 80px;
            height: 80px;
            background-color: #333333;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .blank {
            color: transparent;
        }

        /* Code Styles */
        .code-block {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            line-height: 1.6;
            border: 1px solid #3c3c3c;
            min-width: 300px;
        }

        .code-line {
            padding: 2px 8px;
            border-radius: 4px;
            transition: background-color 0.2s;
            border-left: 4px solid transparent;
        }

        /* Highlight States */
        .active-code {
            background-color: #264f78; /* VS Code selection blue */
            border-left: 4px solid #569cd6;
        }

        .checking-tile {
            border: 4px solid #569cd6;
            transform: scale(1.1);
            background-color: #062f4f;
            box-shadow: 0 0 15px rgba(86, 156, 214, 0.6);
        }

        .found-tile {
            background-color: #2ea043; /* Success green */
            border: 4px solid #3fb950;
            color: white;
            transform: scale(1.1);
            animation: pulse 1.5s infinite alternate;
        }

        .found-code {
            background-color: #1a4f28;
            border-left: 4px solid #3fb950;
        }

        /* Controls */
        .controls {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #0e639c;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: #1177bb;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
            opacity: 0.7;
        }

        #status {
            font-family: monospace;
            font-size: 16px;
            color: #ce9178; /* String color in VS Code */
            background: #1e1e1e;
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid #3c3c3c;
            min-width: 300px;
            text-align: center;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.4); }
            100% { box-shadow: 0 0 20px 10px rgba(63, 185, 80, 0); }
        }
    </style>
</head>
<body>

    <h2>Interactive Loop Visualizer</h2>

    <div class="container">
        <!-- 3x3 Grid -->
        <div class="grid" id="puzzle-grid"></div>

        <!-- Python Code Block -->
        <div class="code-block" id="code">
            <div class="code-line" id="line-1"><span style="color: #569cd6;">def</span> <span style="color: #dcdcaa;">find_blank</span>(state):</div>
            <div class="code-line" id="line-2">&nbsp;&nbsp;&nbsp;&nbsp;<span style="color: #c586c0;">for</span> row <span style="color: #c586c0;">in</span> <span style="color: #4ec9b0;">range</span>(3):</div>
            <div class="code-line" id="line-3">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style="color: #c586c0;">for</span> col <span style="color: #c586c0;">in</span> <span style="color: #4ec9b0;">range</span>(3):</div>
            <div class="code-line" id="line-4">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style="color: #c586c0;">if</span> state[row][col] == 0:</div>
            <div class="code-line" id="line-5">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style="color: #c586c0;">return</span> row, col</div>
        </div>
    </div>

    <div class="controls">
        <div id="status">Click "Next Step" to start tracking variables</div>
        <button id="next-btn" onclick="nextStep()">Next Step &rarr;</button>
    </div>

    <script>
        const initialState = [
            [1, 2, 3],
            [4, 8, 5],
            [6, 0, 7]
        ];

        // Setup the grid
        const gridElement = document.getElementById('puzzle-grid');
        initialState.forEach((rowData, r) => {
            rowData.forEach((val, c) => {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.textContent = val;
                if (val === 0) tile.classList.add('blank');
                tile.id = `tile-${r}-${c}`;
                gridElement.appendChild(tile);
            });
        });

        // State Machine Variables
        let row = 0;
        let col = 0;
        let step = 0; // 0: outer loop, 1: inner loop, 2: condition check, 3: return
        let isDone = false;

        function clearHighlights() {
            document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active-code', 'found-code'));
            document.querySelectorAll('.tile').forEach(el => el.classList.remove('checking-tile'));
        }

        function highlightLine(lineId) {
            document.getElementById(lineId).classList.add('active-code');
        }

        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }

        // Logic executed when clicking "Next Step"
        function nextStep() {
            if (isDone) return;
            clearHighlights();

            if (step === 0) {
                // Entering outer loop
                highlightLine('line-2');
                updateStatus(`Outer Loop: Setting row = ${row}`);
                step = 1;
            } 
            else if (step === 1) {
                // Entering inner loop
                highlightLine('line-3');
                updateStatus(`Inner Loop: Setting col = ${col} (row is ${row})`);
                step = 2;
            } 
            else if (step === 2) {
                // Checking condition
                highlightLine('line-4');
                const tileId = `tile-${row}-${col}`;
                document.getElementById(tileId).classList.add('checking-tile');
                
                const val = initialState[row][col];
                updateStatus(`Checking: is state[${row}][${col}] (${val}) == 0 ?`);

                if (val === 0) {
                    step = 3; // Go to return statement next
                } else {
                    // It was false. Advance the loops.
                    col++;
                    if (col > 2) {
                        col = 0;
                        row++;
                        step = 0; // Go back to outer loop
                    } else {
                        step = 1; // Go back to inner loop
                    }
                }
            } 
            else if (step === 3) {
                // Found the blank! Return statement.
                const line5 = document.getElementById('line-5');
                line5.classList.remove('active-code');
                line5.classList.add('found-code');
                
                const foundTile = document.getElementById(`tile-${row}-${col}`);
                foundTile.classList.add('found-tile');
                
                updateStatus(`Condition True! Returning: ${row}, ${col}`);
                
                isDone = true;
                const btn = document.getElementById('next-btn');
                btn.textContent = "Search Complete";
                btn.disabled = true;
            }
        }
    </script>
</body>
</html>
